# A workflow run is made up of one or more jobs that can run sequentially or in parallel
name: PR Validation (Learn And Share)
on:
  # This workflow contains a single job called "deploy"
  workflow_call:
    #specifying the required inputs for this reusable workflow
    inputs:
      AUTH_ORG_ALIAS:
        required: true
        type: string
      BASE_BRANCH:
        required: true
        type: string
      WORKFLOW_TYPE:
        required: true
        type: string
    #specifying the required secrets for this reusable workflow
    secrets:
      SF_INSTANCE_URL:
        required: true
      SF_USERNAME:
        required: true
      SF_JWT_PRIVATE_KEY:
        required: true
      SF_CLIENT_ID:
        required: false      
jobs:
  deploy:
    name: ${{ github.event.pull_request.head.ref }} --> ${{ github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest

    #setting some environment variables so that it can be utilized in upcoming shell scripts
    env:
      INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
      ORG_ALIAS: ${{ inputs.AUTH_ORG_ALIAS }}
      BASE_BRANCH: ${{ inputs.BASE_BRANCH }}
      CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      USERNAME: ${{ secrets.SF_USERNAME }}
      SECURE_FILE: /tmp/server.key
      # PRODUCTION_DOMAIN: ${{ secrets.PROD_DOMAIN }}
      FORCE_SHOW_SPINNER: true
      #SFDX_REST_DEPLOY: true
      # SKIP_VALIDATION: false
      # SKIP_SFDMU: false

    #passing the docker hub creds to load the dependencies
    # container:
    #   image: sounakck/sfdx-cli
    #   credentials:
    #     username: ${{ secrets.DOCKER_HUB_UN }}
    #     password: ${{ secrets.DOCKER_HUB_PASS }}

    #steps represent a sequence of tasks that will be executed as part of the job.
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Salesforce CLI (sf v2)
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      #install sfdx-git-delta
      - name: Install sfdx-git-delta
        run: echo y | sf plugins install sfdx-git-delta

      # Reads the JWT private key from the GitHub secret and writes it to a temporary file with appropriate permissions
      - name: Write JWT Private Key
        run: |
          echo "${{ secrets.SF_JWT_PRIVATE_KEY }}" > /tmp/server.key
          chmod 600 /tmp/server.key
        shell: bash

      # Authenticate The Org and 
      - name: Populate Auth File And Authorize
        run:  chmod +x ./cicd-utils/scripts-util/authenticateorg.sh && ./cicd-utils/scripts-util/authenticateorg.sh
        shell: bash

      # Generate Delta Package
      - name: Generate Delta Packages
        run: chmod +x ./cicd-utils/scripts-util/generatedeltapkg.sh && ./cicd-utils/scripts-util/generatedeltapkg.sh
      
      # Instantiate PMD Check for the components
      - name: PMD Check
        run: chmod +x ./cicd-utils/scripts-util/scanner.sh && ./cicd-utils/scripts-util/scanner.sh./cicd-utils/scripts-util

      # Dynamically generate test class list
      - name: Test Class List Generation
        run: chmod +x ./cicd-utils/scripts-util/generatetestclass.sh && bash cicd-utils/scripts-util/generatetestclass.sh
        shell: bash
      
      # Validate the components against CI Org
      - name: Validate
        # if: env.DELTA_HAS_CHANGES == 'true'   # ← skips if nothing changed
        run: chmod +x ./cicd-utils/scripts-util/validateComponents.sh && ./cicd-utils/scripts-util/validateComponents.sh
        shell: bash

      # Quick Deploy if validation is success
      - name: Quick Deploy
        if: env.DELTA_HAS_CHANGES == 'true'
        run: chmod +x ./cicd-utils/scripts-util/quickdeploy.sh && ./cicd-utils/scripts-util/quickdeploy.sh
        shell: bash
        # if: ${{ env.SOURCE_ORG_ALIAS != 'CIa' && env.SKIP_VALIDATION }}
        
      # Clean up the key file from the runner
      - name: Remove JWT key file
        if: always()
        run: rm -f /tmp/server.key
      
      # # Metadata Components Deploy
      # - name: Metadata Migration
      #   run: chmod +x ./.github/scripts/sfdmu.sh && ./.github/scripts/sfdmu.sh

      # # Skuid Pages Deploy
      # - name: Deploy skuid pages
      #   run:  chmod +x ./.github/scripts/skuidpush.sh && ./.github/scripts/skuidpush.sh
